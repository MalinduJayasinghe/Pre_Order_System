<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashier — The Pass</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  <style>
    :root {
      --bg: #14100D; --bg-elev: #1E1811; --bg-elev-2: #271F16; --line: #3A2F22;
      --paper: #FAF4E6; --ink: #241D14; --ink-soft: #6B5F4B;
      --text: #F2ECDD; --text-muted: #AFA184;
      --amber: #E8A33D; --amber-dark: #C27F1E; --amber-ink: #241804;
      --green: #4C7A52; --green-light: #D9E6D6; --green-ink: #1D3320;
      --slate-light: #DCE6EA; --slate-ink: #1C2E36;
      --red: #B23A34; --red-light: #F3DAD8; --red-ink: #3B1512;
      --radius: 3px; --shadow-lift: 0 14px 30px -12px rgba(0,0,0,.55);
      --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
      --font-body: 'Work Sans', -apple-system, Segoe UI, sans-serif;
      --font-mono: 'Space Mono', 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }
    button { font-family: inherit; }
    .eyebrow { font-family: var(--font-mono); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--text-muted); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: var(--radius); border: 1px solid transparent; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn-primary { background: var(--amber); color: var(--amber-ink); }
    .btn-primary:hover { background: #f0af4d; }
    .btn-dark { background: var(--bg-elev-2); color: var(--text); border-color: var(--line); }
    .btn-dark:hover { border-color: var(--amber); }
    .btn-sm { padding: 7px 12px; font-size: 12.5px; }
    .btn-block { width: 100%; }
    .icon-btn { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
    .icon-btn:hover { color: var(--red); border-color: var(--red); }

    .ticket { background: var(--paper); color: var(--ink); border-radius: 2px 2px 0 0; box-shadow: var(--shadow-lift); position: relative; }
    .ticket.on-elev::after, .ticket::after { content: ""; display: block; height: 10px; background-image: linear-gradient(135deg, var(--bg-elev) 50%, transparent 50%), linear-gradient(45deg, var(--bg-elev) 50%, transparent 50%); background-size: 14px 14px; background-position: bottom left; background-repeat: repeat-x; }

    .stamp { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; padding: 5px 10px; border-radius: 3px; border: 1.5px solid currentColor; transform: rotate(-2deg); }
    .stamp::before { content: "●"; font-size: 8px; }
    .stamp-pending { color: var(--amber-dark); background: #FBEBCE; }
    .stamp-preparing { color: var(--slate-ink); background: var(--slate-light); }
    .stamp-ready { color: var(--green-ink); background: var(--green-light); }
    .stamp-served { color: var(--ink-soft); background: #E7DEC7; }
    .stamp-cancelled { color: var(--red-ink); background: var(--red-light); }

    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: var(--bg-elev); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .brand { padding: 6px 8px 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .brand-mark { font-family: var(--font-display); font-size: 26px; letter-spacing: .03em; color: var(--amber); }
    .nav-group-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); padding: 14px 10px 8px; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; background: transparent; width: 100%; text-align: left; }
    .nav-link .ico { width: 18px; text-align: center; opacity: .85; font-family: var(--font-mono); }
    .nav-link:hover { color: var(--text); background: var(--bg-elev-2); }
    .nav-link.active { color: var(--amber); background: var(--bg-elev-2); border-color: var(--line); }
    .sidebar-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
    .user-chip { display: flex; align-items: center; gap: 10px; padding: 8px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 15px; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .user-role { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .05em; }

    .main { padding: 30px 38px 60px; max-width: 1320px; }
    .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; gap: 14px; }
    .page-title { font-family: var(--font-display); font-size: 34px; }
    .page-sub { color: var(--text-muted); font-size: 13.5px; margin-top: 2px; }

    .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
    .kanban-col-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
    .kanban-col-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
    .kanban-count { font-family: var(--font-mono); font-size: 11px; background: var(--bg-elev-2); padding: 2px 7px; border-radius: 10px; color: var(--text-muted); }
    .kanban-stack { display: flex; flex-direction: column; gap: 14px; }

    .order-ticket { padding: 14px 16px 18px; }
    .order-ticket-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .ticket-code { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
    .order-ticket-items { font-size: 12.5px; line-height: 1.6; margin: 10px 0; }
    .order-ticket-items .qty { font-family: var(--font-mono); color: var(--ink-soft); margin-right: 4px; }
    .order-ticket-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); margin-bottom: 12px; }
    .order-ticket-actions { display: flex; gap: 8px; align-items: center; }

    .empty-state { text-align: center; padding: 26px 10px; color: var(--ink-soft); }
    .empty-state .glyph { font-size: 24px; margin-bottom: 6px; opacity: .5; font-family: var(--font-mono); }

    .panel { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 26px; }
    .panel-body { padding: 18px 20px 22px; }
    .table-wrap { overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .data-table th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); padding: 0 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .data-table td { padding: 12px; border-bottom: 1px solid var(--line); }
    .data-table tr:last-child td { border-bottom: none; }
    .cell-muted { color: var(--text-muted); }
    .cell-mono { font-family: var(--font-mono); font-size: 12.5px; }
    .loading-row { text-align: center; padding: 30px; color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    #toastStack { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
    .toast { font-family: var(--font-mono); font-size: 13px; padding: 12px 16px; border-radius: var(--radius); background: var(--paper); color: var(--ink); border-left: 4px solid var(--amber); box-shadow: var(--shadow-lift); min-width: 220px; }
    .toast.success { border-left-color: var(--green); }

    @media (max-width: 980px) { .app { grid-template-columns: 1fr; } .sidebar { position: static; height: auto; } .kanban { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .kanban { grid-template-columns: 1fr; } .main { padding: 22px 16px 50px; } }
  </style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">THE PASS</span></div>

    <div class="nav-group-label">Cashier</div>
    <button class="nav-link active" data-tab="queue"><span class="ico">01</span> Order Queue</button>
    <button class="nav-link" data-tab="history"><span class="ico">02</span> Order History</button>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">C</div>
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <button class="btn btn-dark btn-block btn-sm" style="margin-top:10px;" id="logoutBtn">Log Out</button>
    </div>
  </aside>

  <main class="main">

    <section class="tab-panel active" id="tab-queue">
      <div class="topbar">
        <div>
          <div class="page-title">Order Queue</div>
        </div>
        <button class="btn btn-dark btn-sm" id="refreshBtn">↻ Refresh</button>
      </div>

      <div class="kanban">
        <div>
          <div class="kanban-col-head"><span class="kanban-col-title">Pending</span><span class="kanban-count" id="count-PENDING">0</span></div>
          <div class="kanban-stack" id="col-PENDING"></div>
        </div>
        <div>
          <div class="kanban-col-head"><span class="kanban-col-title">Preparing</span><span class="kanban-count" id="count-PREPARING">0</span></div>
          <div class="kanban-stack" id="col-PREPARING"></div>
        </div>
        <div>
          <div class="kanban-col-head"><span class="kanban-col-title">Ready</span><span class="kanban-count" id="count-READY">0</span></div>
          <div class="kanban-stack" id="col-READY"></div>
        </div>
        <div>
          <div class="kanban-col-head"><span class="kanban-col-title">Served</span><span class="kanban-count" id="count-SERVED">0</span></div>
          <div class="kanban-stack" id="col-SERVED"></div>
        </div>
      </div>
    </section>

    <section class="tab-panel" id="tab-history">
      <div class="topbar">
        <div>
          <div class="page-title">Order History</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-body table-wrap">
          <table class="data-table">
            <thead><tr><th>Ticket</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
            <tbody id="historyBody"><tr><td colspan="5" class="loading-row">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toastStack"></div>

<script src="db.js"></script>
<script>

  document.querySelectorAll(".nav-link[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-link[data-tab]").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "history") loadHistory();
    });
  });

  const NEXT_STATUS = { PENDING: "PREPARING", PREPARING: "READY", READY: "SERVED" };
  const NEXT_LABEL = { PENDING: "Start Preparing", PREPARING: "Mark Ready", READY: "Mark Served" };
  const QUEUE_STATUSES = ["PENDING", "PREPARING", "READY", "SERVED"];

  // TODO: once OrderController is implemented, replace DB.getAllOrders() /
  // DB.updateOrderStatus() with:
  //   fetch(API_BASE_URL + "/v1/order", { headers: authHeaders() })
  //   fetch(API_BASE_URL + "/v1/order/" + id + "/status", { method: "PATCH", headers: authHeaders(), body: JSON.stringify({ status }) })
  function loadQueue() {
    const orders = DB.getAllOrders();
    QUEUE_STATUSES.forEach(status => {
      const bucket = orders.filter(o => o.status === status).sort((a, b) => a.orderId - b.orderId);
      document.getElementById("count-" + status).textContent = bucket.length;
      const col = document.getElementById("col-" + status);
      col.innerHTML = bucket.length ? bucket.map(orderCard).join("")
              : `<div class="empty-state"><div class="glyph">--</div><div style="font-size:12.5px;">Nothing here</div></div>`;
    });
  }

  function orderCard(o) {
    const next = NEXT_STATUS[o.status];
    const nextLabel = NEXT_LABEL[o.status];
    return `
      <div class="ticket order-ticket on-elev">
        <div class="order-ticket-head">
          <div>
            <div class="ticket-code">${orderCode(o.orderId)}</div>
            <strong style="font-size:14px;">${esc(o.customerName)}</strong>
          </div>
          <span class="stamp stamp-${o.status.toLowerCase()}">${o.status}</span>
        </div>
        <div class="order-ticket-items">
          ${o.items.map(i => `<div><span class="qty">${i.qty}×</span>${esc(i.name)}</div>`).join("")}
          ${o.notes ? `<div style="margin-top:6px; font-style:italic; color:var(--ink-soft);">"${esc(o.notes)}"</div>` : ""}
        </div>
        <div class="order-ticket-meta">
          <span>Pickup ${esc(o.pickupTime)}</span>
          <span>${money(o.total)}</span>
        </div>
        <div class="order-ticket-actions">
          ${next ? `<button class="btn btn-primary btn-sm btn-block" data-advance="${o.orderId}">${nextLabel}</button>` : ""}
          ${o.status !== "SERVED" ? `<button class="icon-btn" data-cancel="${o.orderId}" title="Cancel order">✕</button>` : ""}
        </div>
      </div>`;
  }

  document.querySelectorAll(".kanban").forEach(k => k.addEventListener("click", e => {
    const advanceId = e.target.closest("[data-advance]")?.dataset.advance;
    const cancelId = e.target.closest("[data-cancel]")?.dataset.cancel;
    if (advanceId) {
      const order = DB.getAllOrders().find(o => o.orderId === Number(advanceId));
      const next = NEXT_STATUS[order.status];
      DB.updateOrderStatus(Number(advanceId), next);
      toast(`${orderCode(advanceId)} → ${next}`, "success");
      loadQueue();
    }
    if (cancelId) {
      if (!confirm("Cancel this order?")) return;
      DB.updateOrderStatus(Number(cancelId), "CANCELLED");
      toast("Order cancelled", "success");
      loadQueue();
      loadHistory();
    }
  }));

  document.getElementById("refreshBtn").addEventListener("click", loadQueue);

  function loadHistory() {
    const list = DB.getAllOrders().filter(o => ["SERVED", "CANCELLED"].includes(o.status));
    document.getElementById("historyBody").innerHTML = list.length ? list.map(o => `
      <tr>
        <td class="cell-mono">${orderCode(o.orderId)}</td>
        <td>${esc(o.customerName)}</td>
        <td class="cell-muted">${o.items.map(i => `${i.qty}× ${esc(i.name)}`).join(", ")}</td>
        <td class="cell-mono">${money(o.total)}</td>
        <td><span class="stamp stamp-${o.status.toLowerCase()}">${o.status}</span></td>
      </tr>`).join("") : '<tr><td colspan="5" class="empty-state">Nothing completed yet</td></tr>';
  }

  loadQueue();
  setInterval(loadQueue, 15000);
</script>
</body>
</html>

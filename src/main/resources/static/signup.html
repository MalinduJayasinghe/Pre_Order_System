<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — The Pass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
<style>
  :root {
    --bg: #14100D;
    --bg-elev: #1E1811;
    --paper: #FAF4E6;
    --ink: #241D14;
    --ink-soft: #6B5F4B;
    --text: #F2ECDD;
    --text-muted: #AFA184;
    --amber: #E8A33D;
    --amber-dark: #C27F1E;
    --amber-ink: #241804;
    --red: #B23A34;
    --radius: 3px;
    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', -apple-system, Segoe UI, sans-serif;
    --font-mono: 'Space Mono', 'Courier New', monospace;
  }
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
  }

  a {
    color: inherit;
  }

  .auth-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
  }

  .auth-brand {
    background:
            radial-gradient(circle at 20% 15%, rgba(232,163,61,.14), transparent 45%),
            radial-gradient(circle at 80% 85%, rgba(76,122,82,.14), transparent 45%),
            var(--bg);

    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand-mark {
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: .03em;
    color: var(--amber);
  }

  .auth-hero {
    font-family: var(--font-display);
    font-size: clamp(48px, 7vw, 84px);
    line-height: .96;
    letter-spacing: .01em;
    max-width: 560px;
  }

  .auth-hero em {
    font-style: normal;
    color: var(--amber);
  }

  .auth-tagline {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 380px;
    margin-top: 16px;
    line-height: 1.5;
  }

  .eyebrow {
    font-family: var(--font-mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--text-muted);
  }

  .auth-panel {
    background: var(--bg-elev);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .ticket {
    background: var(--paper);
    color: var(--ink);
    border-radius: 2px 2px 0 0;
    position: relative;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,.55);
  }

  .ticket-punch {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px dashed var(--ink-soft);
    opacity: .35;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    padding: 34px 32px 30px;
  }

  .auth-card-title {
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: .01em;
    margin-top: 4px;
  }

  .field {
    margin-bottom: 15px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink-soft);
  }

  .field input {
    width: 100%;
    padding: 11px 12px;
    border-radius: var(--radius);
    border: 1px solid #D9CDAE;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
  }

  .field input:focus {
    outline: none;
    border-color: var(--amber);
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .field-error {
    font-size: 11.5px;
    color: var(--red);
    margin-top: 6px;
    display: none;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--amber);
    color: var(--amber-ink);
  }

  .btn-primary:hover {
    background: #f0af4d;
  }

  .btn-block {
    width: 100%;
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .auth-foot {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
  }

  .auth-foot a {
    color: var(--amber-dark);
    font-weight: 600;
    text-decoration: none;
  }

  .auth-foot a:hover {
    text-decoration: underline;
  }

  #toast {
    position: fixed;
    bottom: 22px;
    right: 22px;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    border-left: 4px solid var(--red);
    box-shadow: 0 14px 30px -12px rgba(0,0,0,.55);
    display: none;
    max-width: 280px;
  }

  #toast.success {
    border-left-color: #4C7A52;
  }

  @media (max-width: 980px) {
    .auth-shell {
      grid-template-columns: 1fr;
    }
    .auth-brand {
      padding: 40px 28px;
    }
  }

  @media (max-width: 480px) {
    .field-row {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="auth-shell">

  <div class="auth-brand">
    <div><span class="brand-mark">HELL'S KITCHEN</span></div>
    <div>
      <div class="auth-hero">Pull up<br>a <em>ticket.</em></div>
      <p class="auth-tagline">Create a customer account to start pre-ordering.</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="ticket auth-card">
      <div class="ticket-punch"></div>
      <span class="eyebrow">New customer</span>
      <div class="auth-card-title">Create Account</div>

      <form id="signupForm" novalidate style="margin-top: 20px;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="field">
          <label for="contact">Contact</label>
          <input type="text" id="contact" required />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="password1">Password</label>
            <input type="password" id="password1" required />
          </div>
          <div class="field">
            <label for="password2">Confirm password</label>
            <input type="password" id="password2" required />
          </div>
        </div>
        <div class="field-error" id="signupError"></div>
        <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create Account</button>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>

  const form = document.getElementById("signupForm");
  const btn = document.getElementById("signupBtn");
  const errorEl = document.getElementById("signupError");
  const toast = document.getElementById("toast");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }
  function showToast(msg, kind) {
    toast.className = kind || "";
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => (toast.style.display = "none"), 3500);
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorEl.style.display = "none";

    const email = document.getElementById("email").value.trim();
    const username = document.getElementById("username").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const password1 = document.getElementById("password1").value.trim();
    const password2 = document.getElementById("password2").value.trim();

    if (!email || !username || !contact || !password1 || !password2) {
      showError("All fields are required.");
      return;
    }
    if (password1 !== password2) {
      showError("Passwords do not match.");
      return;
    }
    if (password1.length < 6) {
      showError("Password should be at least 6 characters.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account…";

    let obj = JSON.stringify({
      "email": email,
      "username": username,
      "contact": contact,
      "password": password1,
      "userRoles": "CUSTOMER"
    });

    $.ajax({
      url: "http://localhost:8080/v1/login/signup",
      type: "POST",
      contentType: "application/json",
      data: obj,

      success: function (response){
        alert(response.message);
        showToast("Account created — redirecting to Sign In…", "success");
        window.location.href = "index.html";
      },

      error: function (response) {
        console.error("Error signing up", response);
        showToast("Could not create account");
        showError("Account creation failed");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

  });
</script>
</body>
</html>
